# ============================================================
#  tmux.conf — Catppuccin Mocha, native theme (no theme plugin)
#  Reload:  prefix + R      (prefix = C-a)
#  Switcher (Alt+Tab-like): Alt+w   ·  also prefix+Tab / prefix+f
# ============================================================

# ----------------------------
# Prefix
# ----------------------------
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ----------------------------
# Basic behavior
# ----------------------------
set -g mouse on
set -g mode-keys vi
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,alacritty:Tc"
set -g focus-events on
set -g history-limit 50000
set -g display-time 2000

# Windows start at 1 (matches the keyboard row for Alt+1..9)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Terminal (Alacritty) title follows the current tab
set -g set-titles on
set -g set-titles-string "#S · #I #W"

# Auto-name windows: shell → directory name (~ for home); otherwise → the running command
setw -g automatic-rename on
setw -g automatic-rename-format "#{?#{m/r:^(bash|zsh|fish|sh)$,#{pane_current_command}},#{?#{==:#{pane_current_path},/home/pelias},~,#{b:pane_current_path}},#{pane_current_command}}"

# Vim-style selection in copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ----------------------------
# Tabs (windows) — prefix-free navigation
# ----------------------------
# Alt+1..9 jump straight to a tab, Alt+0 = tab 10
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9
bind -n M-0 select-window -t :=10

# Alt+Left / Alt+Right cycle tabs;  Alt+a toggles last tab
bind -n M-Left  previous-window
bind -n M-Right next-window
bind -n M-a     last-window

# Alt+Shift+Left / Right reorder tabs
bind -n M-S-Left  swap-window -d -t -1
bind -n M-S-Right swap-window -d -t +1

# Alt+t new tab (same dir) · Alt+, rename · Alt+q close (asks)
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-, command-prompt -I "#W" -p "rename tab:" "rename-window '%%'"
bind -n M-q confirm-before -p "close tab #I #W? (y/n)" kill-window

# Double-click a tab in the status bar to rename it
bind -n DoubleClick1Status command-prompt -p "rename tab:" "rename-window -t '{mouse}' '%%'"

# Alt+Tab-style switcher with live preview (fzf popup, most-recent first).
# KDE grabs Alt+Tab itself, so Alt+w is the main key; Alt+Tab works if you free it in KWin.
bind -n M-w   display-popup -E -b rounded -w 92% -h 82% -x C -y C "bash $HOME/.local/bin/tmux-switcher"
bind -n M-Tab display-popup -E -b rounded -w 92% -h 82% -x C -y C "bash $HOME/.local/bin/tmux-switcher"
bind    Tab   display-popup -E -b rounded -w 92% -h 82% -x C -y C "bash $HOME/.local/bin/tmux-switcher"
bind    f     display-popup -E -b rounded -w 92% -h 82% -x C -y C "bash $HOME/.local/bin/tmux-switcher"

# Prefix shortcuts kept from before
bind t new-window -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# Vim-style pane navigation / resize
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Clock
bind T clock-mode
set -g clock-mode-style 24
set -g clock-mode-colour "#cba6f7"

# ----------------------------
# Theme — Catppuccin Mocha palette
# ----------------------------
set -g @c_base     "#1e1e2e"
set -g @c_mantle   "#181825"
set -g @c_crust    "#11111b"
set -g @c_surface0 "#313244"
set -g @c_surface1 "#45475a"
set -g @c_surface2 "#585b70"
set -g @c_overlay0 "#6c7086"
set -g @c_subtext0 "#a6adc8"
set -g @c_text     "#cdd6f4"
set -g @c_mauve    "#cba6f7"
set -g @c_blue     "#89b4fa"
set -g @c_green    "#a6e3a1"
set -g @c_yellow   "#f9e2af"
set -g @c_red      "#f38ba8"
set -g @c_peach    "#fab387"
set -g @c_teal     "#94e2d5"
set -g @c_lavender "#b4befe"

# Icon for the tab, chosen from the running command (Nerd Font glyphs)
set -g @win_icon "#{?#{m/r:^(n?vim|vi)$,#{pane_current_command}},,#{?#{m/r:^(python[0-9.]*|ipython|uv)$,#{pane_current_command}},,#{?#{m/r:^(node|npm|pnpm|yarn|bun)$,#{pane_current_command}},,#{?#{m/r:^(claude|codex|opencode|aider)$,#{pane_current_command}},󰚩,#{?#{m/r:^(ssh|mosh)$,#{pane_current_command}},󰣀,#{?#{m/r:^(docker|kubectl|k9s)$,#{pane_current_command}},,#{?#{m/r:^(git|lazygit|tig)$,#{pane_current_command}},󰊢,#{?#{m/r:^(bash|zsh|fish|sh)$,#{pane_current_command}},,}}}}}}}}"

# Status bar
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 80

# Left: session pill — blue normally, red while the prefix is held, yellow in copy mode
set -g @mode_color "#{?client_prefix,#{@c_red},#{?pane_in_mode,#{@c_yellow},#{@c_blue}}}"
set -g @mode_label "#{?client_prefix, PREFIX,#{?pane_in_mode, COPY,}}"
set -g status-left "#[fg=#{E:@mode_color},bg=#{@c_mantle}]#[fg=#{@c_crust},bg=#{E:@mode_color},bold]  #S#{E:@mode_label} #[fg=#{E:@mode_color},bg=#{@c_mantle}] "

# Tabs
set -g window-status-separator " "
setw -g window-status-format "#[fg=#{?window_bell_flag,#{@c_yellow},#{@c_surface0}},bg=#{@c_mantle}]#[fg=#{?window_bell_flag,#{@c_crust},#{@c_subtext0}},bg=#{?window_bell_flag,#{@c_yellow},#{@c_surface0}}]#I #[fg=#{@c_subtext0},bg=#{@c_surface0}]#{E:@win_icon} #{=|22|…:window_name}#{?window_zoomed_flag, 󰁌,}#[fg=#{@c_surface0},bg=#{@c_mantle}]"
setw -g window-status-current-format "#[fg=#{@c_mauve},bg=#{@c_mantle}]#[fg=#{@c_crust},bg=#{@c_mauve},bold]#I #[fg=#{@c_mauve},bg=#{@c_surface1}]#[fg=#{@c_text},bg=#{@c_surface1},bold] #{E:@win_icon} #{=|28|…:window_name}#{?window_zoomed_flag, 󰁌,} #[fg=#{@c_surface1},bg=#{@c_mantle}]"
setw -g window-status-style default
setw -g window-status-current-style default
setw -g window-status-last-style default
setw -g window-status-bell-style default
setw -g window-status-activity-style default

# Right: pane count when split · host · time · date
set -g status-right "#{?#{>:#{window_panes},1},#[fg=#{@c_overlay0}]#{window_panes} panes  ,}#[fg=#{@c_surface0},bg=#{@c_mantle}]#[fg=#{@c_text},bg=#{@c_surface0}]󰒋 #h#[fg=#{@c_surface0},bg=#{@c_mantle}] #[fg=#{@c_blue},bg=#{@c_mantle}]#[fg=#{@c_crust},bg=#{@c_blue},bold] %H:%M#[fg=#{@c_blue},bg=#{@c_surface0}]#[fg=#{@c_text},bg=#{@c_surface0}] %a %d %b #[fg=#{@c_surface0},bg=#{@c_mantle}]"

# Panes
set -g pane-border-lines single
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#cba6f7"
set -g pane-border-indicators colour

# Prompts, messages, copy-mode highlight, popups, menus
set -g message-style "fg=#f9e2af,bg=#313244,bold"
set -g message-command-style "fg=#94e2d5,bg=#313244"
set -g mode-style "fg=#11111b,bg=#f9e2af"
set -g popup-style "bg=#1e1e2e,fg=#cdd6f4"
set -g popup-border-style "fg=#cba6f7,bg=#1e1e2e"
set -g popup-border-lines rounded
set -g menu-style "fg=#cdd6f4,bg=#313244"
set -g menu-selected-style "fg=#11111b,bg=#cba6f7,bold"
set -g menu-border-style "fg=#cba6f7"
set -g menu-border-lines rounded

# ----------------------------
# Plugins (theme is native; catppuccin/tmux-cpu removed — they overrode the tabs)
# ----------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# TPM must be last
run '~/.tmux/plugins/tpm/tpm'

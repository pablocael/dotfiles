# Silent output for automated test browsers (Playwright). WirePlumber sends
# their streams here — see wireplumber.conf.d/53-test-browsers-mute.conf.
context.objects = [
  { factory = adapter
    args = {
      factory.name     = support.null-audio-sink
      node.name        = "test-browsers-mute"
      node.description = "Muted (test browsers)"
      media.class      = Audio/Sink
      audio.position   = [ FL FR ]
      node.virtual     = true
      priority.session = 0
      priority.driver  = 0
    }
  }
]

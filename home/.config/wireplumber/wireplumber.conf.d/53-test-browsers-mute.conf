# Playwright test browsers (WebKit "MiniBrowser", headless Chromium) play test
# media through the default output (the earbuds). Give their streams their own
# restore key; its saved target in ~/.local/state/wireplumber/stream-properties
# ("Output/Audio:media.role:test-browser" -> test-browsers-mute) routes them to
# the silent sink from pipewire.conf.d/60-test-browsers-mute.conf.
# If that sink is missing they fall back to normal routing.
stream.rules = [
  {
    matches = [
      { application.name = "MiniBrowser" }
      { application.process.binary = "WPEWebProcess" }
      { application.process.binary = "~chrome-headless-shell|headless_shell" }
    ]
    actions = { update-props = { media.role = "test-browser" } }
  }
]

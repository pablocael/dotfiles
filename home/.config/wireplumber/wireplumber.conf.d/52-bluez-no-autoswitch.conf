# Don't drop Bluetooth headsets into HSP/HFP (phone-quality, mono 16kHz) just
# because some app opened a microphone. On this box (Intel BE200 + Galaxy Buds2
# Pro) the SCO link is flaky: "SCO packet for unknown connection handle" and
# "Failure in Bluetooth audio transport" errors, plus seconds-long profile
# switches. Mic comes from the C270 webcam instead.
# For a call with the buds mic: KDE audio applet -> Galaxy Buds2 Pro -> Profile
# -> "Headset Head Unit (mSBC)", then back to "High Fidelity Playback".
# Revert: delete this file and `systemctl --user restart wireplumber`.
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}

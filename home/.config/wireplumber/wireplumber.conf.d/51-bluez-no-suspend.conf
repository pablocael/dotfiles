# Keep Bluetooth outputs awake. Default WirePlumber suspends idle sinks after
# 5s; re-opening the A2DP transport on the Galaxy Buds takes ~1-2s, so the
# first second(s) of audio in a video are lost/delayed.
# Trade-off: buds keep a silent stream open -> slightly more buds battery use.
# Revert: delete this file and `systemctl --user restart wireplumber`.
monitor.bluez.rules = [
  {
    matches = [ { node.name = "~bluez_output.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
]
